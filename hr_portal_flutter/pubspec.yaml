name: hr_portal_flutter
description: HR Portal Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP Client
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # Charts
  fl_chart: ^0.66.0
  
  # Date/Time
  intl: ^0.19.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # File handling
  file_picker: ^6.1.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/hr_portal_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/hr_portal_icon.png"
    background_color: "#1E3A8A"
    theme_color: "#10B981"
  windows:
    generate: true
    image_path: "assets/icon/hr_portal_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/hr_portal_icon.png"
