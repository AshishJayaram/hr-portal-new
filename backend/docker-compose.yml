version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hr-portal-postgres
    environment:
      POSTGRES_DB: hr_portal
      POSTGRES_USER: hr_portal
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - hr-portal-network

  redis:
    image: redis:7-alpine
    container_name: hr-portal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hr-portal-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-portal-backend
    ports:
      - "8080:8080"
    # Load environment variables from .env (copy env.example to .env and fill values)
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hr_portal
      - DB_PASSWORD=password
      - DB_NAME=hr_portal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # SMTP configuration (falls back to values from .env if set there)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FROM_EMAIL=${FROM_EMAIL}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - hr-portal-network

volumes:
  postgres_data:
  redis_data:

networks:
  hr-portal-network:
    driver: bridge
